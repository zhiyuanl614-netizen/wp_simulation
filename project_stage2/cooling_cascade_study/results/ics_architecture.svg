<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f6fb2"/></marker>
    <marker id="arrDn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e8b57"/></marker>
    <marker id="arrWarn" markerWidth="13" markerHeight="13" refX="9" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrFlow" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0e7490"/></marker>
    <marker id="arrIx" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="arrIxS" markerWidth="11" markerHeight="11" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 Z" fill="#7c3aed"/></marker>
    <marker id="arrCpl" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e08a1e"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1070" fill="#f5f8fb"/>
  <text x="720" y="38" text-anchor="middle" font-size="27" font-weight="700" fill="#123a5c">冷却水—电网耦合 工业控制系统（ICS）架构图</text>
  <text x="720" y="64" text-anchor="middle" font-size="14" fill="#5b6b7a">三个独立域各设三级信息系统 · 市政供水 ICS 经早期预警链路通知电力系统 ICS · 冷却水侧与电力系统侧 ICS 厂内交互</text>

  <!-- ===== 早期预警大弧线 (市政ICS -> 电力ICS, 独立跨域) ===== -->
  <path d="M245 150 L245 104 L1180 104 L1180 150" fill="none" stroke="#c0392b" stroke-width="3.4" stroke-dasharray="10 6" marker-end="url(#arrWarn)"/>
  <rect x="560" y="90" width="330" height="28" rx="7" fill="#c0392b"/>
  <text x="725" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">早期预警：市政供水 ICS → 电力系统 ICS（独立跨域链路）</text>

  <!-- ============================================================ -->
  <!-- 市政供水域 (独立运行)                                         -->
  <!-- ============================================================ -->
  <rect x="24" y="128" width="430" height="500" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="239" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">市政供水域（独立运行）</text>

  <!-- 市政 ICS 三级 -->
  <rect x="44" y="164" width="390" height="252" rx="9" fill="#e8edf3" stroke="#64748b" stroke-width="1.4"/>
  <text x="239" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">市政供水 ICS（三级）</text>
  <rect x="58" y="192" width="362" height="60" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.3"/>
  <text x="68" y="212" font-size="12.5" font-weight="700" fill="#475569">第三级 调度中心</text>
  <text x="68" y="230" font-size="11" fill="#5b6b7a">市政供水调度 · 断供研判 · 发出预警</text>
  <rect x="58" y="256" width="362" height="56" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.3"/>
  <text x="68" y="275" font-size="12.5" font-weight="700" fill="#475569">第二级 SCADA</text>
  <text x="68" y="292" font-size="11" fill="#5b6b7a">管网压力监测 · 故障检测 · 告警归档</text>
  <rect x="58" y="316" width="362" height="56" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.3"/>
  <text x="68" y="335" font-size="12.5" font-weight="700" fill="#475569">第一级 现场 PLC</text>
  <text x="68" y="352" font-size="11" fill="#5b6b7a">压力/流量采样 · 阀门/泵站本地控制</text>
  <!-- 市政 ICS 内部上下行 -->
  <line x1="46" y1="316" x2="46" y2="254" stroke="#1f6fb2" stroke-width="1.8" marker-end="url(#arrUp)"/>
  <line x1="432" y1="252" x2="432" y2="314" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#arrDn)"/>

  <!-- 市政 物理: 供水管网 -->
  <rect x="44" y="440" width="390" height="96" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
  <text x="239" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">市政供水管网</text>
  <text x="239" y="492" text-anchor="middle" font-size="11.5" fill="#c0392b">⚡故障源：管网失压 / 爆管断供</text>
  <text x="239" y="510" text-anchor="middle" font-size="11" fill="#5b6b7a">供水压力 p_muni</text>
  <!-- 市政 ICS <-> 物理 采集/控制 -->
  <line x1="150" y1="440" x2="150" y2="416" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrUp)"/>
  <line x1="330" y1="416" x2="330" y2="440" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrDn)"/>
  <text x="239" y="432" text-anchor="middle" font-size="10" fill="#64748b">采集 / 控制</text>

  <!-- ============================================================ -->
  <!-- 电厂侧 外框 (冷却水系统 + 电力系统, ICS 交互)                 -->
  <!-- ============================================================ -->
  <rect x="484" y="126" width="932" height="916" rx="14" fill="#fbfdfd" stroke="#0e7490" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="950" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0e6b7a">电厂侧（冷却水系统 + 电力系统　—　两侧 ICS 厂内交互）</text>

  <!-- ===== 冷却水系统侧 ===== -->
  <rect x="500" y="162" width="430" height="866" rx="11" fill="#ecf7f6" stroke="#0e7490" stroke-width="1.3"/>
  <text x="715" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">冷却水系统侧</text>

  <!-- 冷却水 ICS 三级 -->
  <rect x="516" y="196" width="398" height="236" rx="9" fill="#e0f0ef" stroke="#0e7490" stroke-width="1.4"/>
  <text x="715" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">冷却水 ICS（三级）</text>
  <rect x="528" y="222" width="374" height="56" rx="6" fill="#fff" stroke="#0e7490" stroke-width="1.3"/>
  <text x="538" y="241" font-size="12.5" font-weight="700" fill="#0e7490">第三级 调度中心</text>
  <text x="538" y="258" font-size="11" fill="#5b6b7a">循环水系统调度 · 与电力ICS协同</text>
  <rect x="528" y="282" width="374" height="52" rx="6" fill="#fff" stroke="#0e7490" stroke-width="1.3"/>
  <text x="538" y="300" font-size="12.5" font-weight="700" fill="#0e7490">第二级 SCADA</text>
  <text x="538" y="317" font-size="11" fill="#5b6b7a">水位/流量/背压监测 · 告警归档</text>
  <rect x="528" y="338" width="374" height="52" rx="6" fill="#fff" stroke="#0e7490" stroke-width="1.3"/>
  <text x="538" y="356" font-size="12.5" font-weight="700" fill="#0e7490">第一级 现场 PLC</text>
  <text x="538" y="373" font-size="11" fill="#5b6b7a">液位控制阀 · 循环水泵/汽机保护</text>
  <line x1="518" y1="338" x2="518" y2="280" stroke="#1f6fb2" stroke-width="1.8" marker-end="url(#arrUp)"/>
  <line x1="900" y1="278" x2="900" y2="336" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#arrDn)"/>

  <!-- 冷却水 物理设备 -->
  <rect x="518" y="456" width="184" height="60" rx="7" fill="#fff" stroke="#0e7490" stroke-width="2.4"/>
  <text x="610" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">高位补水箱</text>
  <text x="610" y="500" text-anchor="middle" font-size="10.5" fill="#c0392b">★临界设备 · H_tank</text>

  <rect x="728" y="456" width="184" height="60" rx="7" fill="#fff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="820" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">集水池</text>
  <text x="820" y="500" text-anchor="middle" font-size="10.5" fill="#5b6b7a">液位 H_pool</text>

  <rect x="728" y="576" width="184" height="60" rx="7" fill="#fff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="820" y="600" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">循环水泵</text>
  <text x="820" y="620" text-anchor="middle" font-size="10.5" fill="#5b6b7a">m_cw · NPSH保护</text>

  <rect x="728" y="696" width="184" height="60" rx="7" fill="#fff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="820" y="720" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">凝汽器</text>
  <text x="820" y="740" text-anchor="middle" font-size="10.5" fill="#5b6b7a">背压 p_b</text>

  <rect x="518" y="696" width="184" height="60" rx="7" fill="#fff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="610" y="720" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">冷却塔</text>
  <text x="610" y="740" text-anchor="middle" font-size="10" fill="#5b6b7a">蒸发/排污/风吹损失</text>

  <!-- 冷却水物理流向 -->
  <line x1="702" y1="486" x2="726" y2="486" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrFlow)"/>
  <text x="714" y="478" text-anchor="middle" font-size="9.5" fill="#0e7490">自流</text>
  <line x1="820" y1="516" x2="820" y2="574" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrFlow)"/>
  <text x="832" y="550" font-size="9.5" fill="#0e7490">抽水</text>
  <line x1="820" y1="636" x2="820" y2="694" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrFlow)"/>
  <text x="832" y="670" font-size="9.5" fill="#0e7490">冷却水</text>
  <line x1="726" y1="726" x2="704" y2="726" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrFlow)"/>
  <text x="715" y="718" text-anchor="middle" font-size="9.5" fill="#c0392b">热水</text>
  <path d="M610 696 L610 640 L668 640 L668 490 L726 490" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#arrFlow)"/>
  <text x="600" y="620" text-anchor="middle" font-size="9.5" fill="#0e7490" transform="rotate(-90 600 620)">回流冷却</text>

  <!-- 冷却水 ICS<->物理 采集/控制 -->
  <line x1="610" y1="456" x2="610" y2="432" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrUp)"/>
  <text x="700" y="448" text-anchor="middle" font-size="10" fill="#0e7490">采集(H_tank/H_pool/m_cw/p_b) / 控制(阀·泵)</text>

  <!-- ===== 电力系统侧 ===== -->
  <rect x="946" y="162" width="454" height="866" rx="11" fill="#fdf3ec" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="1173" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#b5651d">电力系统侧</text>

  <!-- 电力 ICS 三级 -->
  <rect x="962" y="196" width="422" height="236" rx="9" fill="#fae9da" stroke="#e08a1e" stroke-width="1.4"/>
  <text x="1173" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b5651d">电力系统 ICS（三级）</text>
  <rect x="974" y="222" width="398" height="56" rx="6" fill="#fff" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="984" y="241" font-size="12.5" font-weight="700" fill="#b5651d">第三级 电网调度中心</text>
  <text x="984" y="258" font-size="11" fill="#5b6b7a">接收预警 → 决策主动处置(备用/降负荷/切负荷)</text>
  <rect x="974" y="282" width="398" height="52" rx="6" fill="#fff" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="984" y="300" font-size="12.5" font-weight="700" fill="#b5651d">第二级 SCADA/EMS</text>
  <text x="984" y="317" font-size="11" fill="#5b6b7a">频率/电压/潮流监测 · 告警 · 状态估计</text>
  <rect x="974" y="338" width="398" height="52" rx="6" fill="#fff" stroke="#e08a1e" stroke-width="1.3"/>
  <text x="984" y="356" font-size="12.5" font-weight="700" fill="#b5651d">第一级 现场 RTU/PLC</text>
  <text x="984" y="373" font-size="11" fill="#5b6b7a">机组调速/励磁控制 · 保护 · UFLS</text>
  <line x1="964" y1="338" x2="964" y2="280" stroke="#1f6fb2" stroke-width="1.8" marker-end="url(#arrUp)"/>
  <line x1="1370" y1="278" x2="1370" y2="336" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#arrDn)"/>

  <!-- 电力 物理 -->
  <rect x="984" y="576" width="378" height="66" rx="8" fill="#fff" stroke="#e08a1e" stroke-width="1.8"/>
  <text x="1173" y="604" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b5651d">汽轮发电机组</text>
  <text x="1173" y="625" text-anchor="middle" font-size="11" fill="#5b6b7a">调速器 / 励磁 / 高背压保护</text>

  <rect x="984" y="700" width="378" height="66" rx="8" fill="#fff" stroke="#e08a1e" stroke-width="1.8"/>
  <text x="1173" y="728" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b5651d">IEEE-118 输电网</text>
  <text x="1173" y="749" text-anchor="middle" font-size="11" fill="#5b6b7a">潮流转移 / 频率 / 电压 / 过载级联 / UFLS</text>

  <line x1="1173" y1="642" x2="1173" y2="698" stroke="#e08a1e" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 电力 ICS<->物理 采集/控制 -->
  <line x1="1120" y1="576" x2="1120" y2="432" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrUp)"/>
  <line x1="1230" y1="432" x2="1230" y2="576" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrDn)"/>
  <text x="1173" y="452" text-anchor="middle" font-size="10" fill="#b5651d">采集(f/V/潮流) / 控制(降负荷·切负荷·保护)</text>

  <!-- ===== 冷却水 ICS <-> 电力 ICS 厂内交互 (双向) ===== -->
  <line x1="915" y1="300" x2="960" y2="300" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrIx)" marker-start="url(#arrIxS)"/>
  <rect x="884" y="436" width="94" height="0" /> 
  <rect x="878" y="252" width="118" height="24" rx="6" fill="#7c3aed"/>
  <text x="937" y="269" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">厂内 ICS 交互</text>

  <!-- ===== 市政物理 -> 冷却水物理 (市政补水, 跨域水流) ===== -->
  <line x1="434" y1="486" x2="516" y2="486" stroke="#0e7490" stroke-width="2.6" marker-end="url(#arrFlow)"/>
  <rect x="430" y="452" width="90" height="24" rx="6" fill="#0e7490"/>
  <text x="475" y="469" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">市政补水</text>

  <!-- ===== 冷却水物理(凝汽器) -> 电力物理(发电机) 背压耦合 ===== -->
  <line x1="912" y1="726" x2="982" y2="612" stroke="#e08a1e" stroke-width="2.6" marker-end="url(#arrCpl)"/>
  <rect x="900" y="660" width="150" height="24" rx="6" fill="#e08a1e"/>
  <text x="975" y="677" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">背压 → 功率降额</text>

  <!-- ============ 图例 ============ -->
  <rect x="40" y="900" width="420" height="150" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="924" font-size="13" font-weight="700" fill="#334155">图例</text>
  <line x1="60" y1="946" x2="98" y2="946" stroke="#1f6fb2" stroke-width="2" marker-end="url(#arrUp)"/>
  <text x="106" y="950" font-size="11.5" fill="#33506b">信息上行（采集/上传）</text>
  <line x1="270" y1="946" x2="308" y2="946" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrDn)"/>
  <text x="316" y="950" font-size="11.5" fill="#33506b">指令下行（调度/控制）</text>
  <line x1="60" y1="976" x2="98" y2="976" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrFlow)"/>
  <text x="106" y="980" font-size="11.5" fill="#33506b">物理水流</text>
  <line x1="270" y1="976" x2="308" y2="976" stroke="#e08a1e" stroke-width="2.4" marker-end="url(#arrCpl)"/>
  <text x="316" y="980" font-size="11.5" fill="#33506b">跨域物理耦合（背压→功率）</text>
  <line x1="60" y1="1006" x2="98" y2="1006" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrWarn)"/>
  <text x="106" y="1010" font-size="11.5" fill="#33506b">早期预警（市政 ICS → 电力 ICS）</text>
  <line x1="270" y1="1006" x2="308" y2="1006" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrIx)" marker-start="url(#arrIxS)"/>
  <text x="316" y="1010" font-size="11.5" fill="#33506b">厂内 ICS 交互（冷却水↔电力）</text>
  <rect x="60" y="1028" width="16" height="14" rx="3" fill="#fff" stroke="#0e7490" stroke-width="2.4"/>
  <text x="84" y="1040" font-size="11.5" fill="#33506b">★临界设备：高位补水箱</text>
</svg>
