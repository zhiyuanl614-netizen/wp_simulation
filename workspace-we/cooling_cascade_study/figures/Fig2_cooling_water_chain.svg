<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#17a2b8"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e08a1e"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- "ignored middle process" dashed box (make-up tank .. LP cylinder) -->
  <rect x="150" y="70" width="616" height="210" rx="12" fill="#f4f6f8" stroke="#8a97a3" stroke-dasharray="8 5" stroke-width="1.8"/>
  <text x="458" y="92" font-size="12" font-weight="700" fill="#5b6b7a" text-anchor="middle">Intermediate process ignored by prior work  =  first modeled here (Contribution 1)</text>

  <!-- flow-variable labels (above equipment row) -->
  <g font-size="10" fill="#0e7d8c" text-anchor="middle">
    <text x="155" y="150">Q_make</text>
    <text x="287" y="150">Q_grav</text>
    <text x="419" y="150">m_cw</text>
    <text x="551" y="150">cooling water</text>
    <text x="683" y="150">p_b</text>
    <text x="819" y="150" fill="#c0392b">k_p derate</text>
  </g>

  <!-- Intake node -->
  <g text-anchor="middle">
    <rect x="30" y="160" width="110" height="96" rx="8" fill="#fff3f3" stroke="#c0392b" stroke-width="1.6"/>
    <text x="85" y="196" font-size="12" font-weight="600" fill="#c0392b">Intake node</text>
    <text x="85" y="222" font-size="10" fill="#7b241c">failure source</text>
    <text x="85" y="240" font-size="10" fill="#7b241c">head &lt; 28 m</text>
  </g>
  <!-- Make-up tank -->
  <g text-anchor="middle">
    <rect x="168" y="160" width="104" height="96" rx="8" fill="#ffffff" stroke="#17a2b8" stroke-width="1.6"/>
    <rect x="188" y="182" width="64" height="36" rx="3" fill="#d6f0f4" stroke="#17a2b8"/>
    <text x="220" y="238" font-size="12" font-weight="600" fill="#0e7d8c">Make-up tank</text>
    <text x="220" y="253" font-size="10" fill="#5b6b7a">mass balance</text>
  </g>
  <!-- Pool -->
  <g text-anchor="middle">
    <rect x="300" y="160" width="104" height="96" rx="8" fill="#ffffff" stroke="#17a2b8" stroke-width="1.6"/>
    <path d="M316,204 h72 v34 a4,4 0 0 1 -4,4 h-64 a4,4 0 0 1 -4,-4 Z" fill="#d6f0f4" stroke="#17a2b8"/>
    <text x="352" y="195" font-size="12" font-weight="600" fill="#0e7d8c">Pool</text>
    <text x="352" y="253" font-size="10" fill="#5b6b7a">storage buffer</text>
  </g>
  <!-- Circ. pump -->
  <g text-anchor="middle">
    <rect x="432" y="160" width="104" height="96" rx="8" fill="#ffffff" stroke="#17a2b8" stroke-width="1.6"/>
    <circle cx="484" cy="200" r="18" fill="#d6f0f4" stroke="#17a2b8"/>
    <path d="M484,200 L499,193 M484,200 L499,207 M484,200 L471,189" stroke="#0e7d8c" stroke-width="1.8"/>
    <text x="484" y="238" font-size="12" font-weight="600" fill="#0e7d8c">Circ. pump</text>
    <text x="484" y="253" font-size="10" fill="#5b6b7a">NPSH / cavitation</text>
  </g>
  <!-- Condenser -->
  <g text-anchor="middle">
    <rect x="564" y="160" width="104" height="96" rx="8" fill="#ffffff" stroke="#17a2b8" stroke-width="1.6"/>
    <rect x="580" y="182" width="72" height="30" rx="3" fill="#d6f0f4" stroke="#17a2b8"/>
    <line x1="586" y1="190" x2="646" y2="190" stroke="#0e7d8c"/><line x1="586" y1="197" x2="646" y2="197" stroke="#0e7d8c"/><line x1="586" y1="204" x2="646" y2="204" stroke="#0e7d8c"/>
    <text x="616" y="238" font-size="12" font-weight="600" fill="#0e7d8c">Condenser</text>
    <text x="616" y="253" font-size="10" fill="#5b6b7a">ε-NTU heat exch.</text>
  </g>
  <!-- LP cylinder -->
  <g text-anchor="middle">
    <rect x="696" y="160" width="104" height="96" rx="8" fill="#ffffff" stroke="#17a2b8" stroke-width="1.6"/>
    <path d="M712,222 L742,190 L772,190 L784,222 Z" fill="#d6f0f4" stroke="#17a2b8"/>
    <text x="748" y="238" font-size="12" font-weight="600" fill="#0e7d8c">LP cylinder</text>
    <text x="748" y="253" font-size="10" fill="#5b6b7a">back-pres. → derate</text>
  </g>
  <!-- Generator -->
  <g text-anchor="middle">
    <rect x="836" y="160" width="120" height="96" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
    <circle cx="896" cy="198" r="18" fill="#f9d5d0" stroke="#c0392b"/><text x="896" y="203" font-size="13" font-weight="700" fill="#c0392b">G</text>
    <text x="896" y="238" font-size="12" font-weight="600" fill="#a5281b">Generator</text>
    <text x="896" y="253" font-size="10" fill="#a5281b">output↓ / trip</text>
  </g>

  <!-- main flow arrows (teal) -->
  <g stroke="#17a2b8" stroke-width="2.4" fill="none">
    <line x1="140" y1="208" x2="166" y2="208" marker-end="url(#a)"/>
    <line x1="272" y1="208" x2="298" y2="208" marker-end="url(#a)"/>
    <line x1="404" y1="208" x2="430" y2="208" marker-end="url(#a)"/>
    <line x1="536" y1="208" x2="562" y2="208" marker-end="url(#a)"/>
    <line x1="668" y1="208" x2="694" y2="208" marker-end="url(#a)"/>
  </g>
  <!-- LP cylinder -> Generator (red: cross to power side) -->
  <line x1="800" y1="208" x2="834" y2="208" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- closed-loop cooling return: condenser -> tower -> pool -->
  <g text-anchor="middle">
    <rect x="470" y="316" width="120" height="60" rx="8" fill="#fff7e6" stroke="#e08a1e" stroke-width="1.5"/>
    <path d="M492,352 q12,-18 24,0 q12,-18 24,0" fill="none" stroke="#b9770f" stroke-width="1.8"/>
    <text x="530" y="340" font-size="12" font-weight="600" fill="#b9770f">Cooling tower</text>
    <text x="530" y="368" font-size="10" fill="#b9770f">evap. / heat rejection</text>
  </g>
  <!-- condenser -> tower (hot return) -->
  <path d="M616,256 L616,300 L590,300 L590,316" fill="none" stroke="#e08a1e" stroke-width="2" marker-end="url(#ag)"/>
  <text x="636" y="292" font-size="10" fill="#b9770f" text-anchor="start">hot return</text>
  <!-- tower -> pool (cooled return, closed loop) -->
  <path d="M470,346 L352,346 L352,256" fill="none" stroke="#e08a1e" stroke-width="2" marker-end="url(#ag)"/>
  <text x="360" y="338" font-size="10" fill="#b9770f" text-anchor="start">cooled return</text>

  <!-- legend -->
  <g font-size="10">
    <line x1="40" y1="392" x2="72" y2="392" stroke="#17a2b8" stroke-width="2.4" marker-end="url(#a)"/><text x="78" y="396" fill="#1a2b3c">Cooling-water flow</text>
    <line x1="230" y1="392" x2="262" y2="392" stroke="#c0392b" stroke-width="2.4" marker-end="url(#ar)"/><text x="268" y="396" fill="#1a2b3c">Water → power coupling</text>
    <line x1="470" y1="392" x2="502" y2="392" stroke="#e08a1e" stroke-width="2" marker-end="url(#ag)"/><text x="508" y="396" fill="#1a2b3c">Closed-loop return</text>
  </g>
</svg>
